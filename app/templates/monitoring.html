{% extends "base.html" %}
{% block subtitle %}Salud del equipo local y comprobaciones TCP ejecutadas por Monitoring Agent.{% endblock %}
{% block content %}
<section class="metric-grid"><div class="metric"><div class="metric__label">CPU</div><div class="metric__value" id="cpu-value">—</div><div class="health-bar"><span id="cpu-bar"></span></div></div><div class="metric"><div class="metric__label">Memoria</div><div class="metric__value" id="memory-value">—</div><div class="metric__detail" id="memory-detail"></div><div class="health-bar"><span id="memory-bar"></span></div></div><div class="metric"><div class="metric__label">Disco</div><div class="metric__value" id="disk-value">—</div><div class="metric__detail" id="disk-detail"></div><div class="health-bar"><span id="disk-bar"></span></div></div><div class="metric"><div class="metric__label">Procesos</div><div class="metric__value" id="process-value">—</div><div class="metric__detail" id="boot-detail"></div></div></section>
<section class="section panel"><div class="panel-header"><h2 class="panel-title">Comprobación TCP</h2></div><div class="panel-body"><form class="toolbar" id="tcp-form"><input class="input" id="tcp-host" value="127.0.0.1" placeholder="Host"><input class="input" id="tcp-port" type="number" min="1" max="65535" value="8000"><button class="btn btn--primary">COMPROBAR</button></form><div class="result-box" id="tcp-result">Sin comprobación.</div></div></section>
{% endblock %}
