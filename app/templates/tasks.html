{% extends "base.html" %}
{% block subtitle %}Tareas persistentes y recordatorios del entorno local.{% endblock %}
{% block content %}
<section class="grid-two"><div class="panel"><div class="panel-header"><h2 class="panel-title">Nueva tarea</h2></div><div class="panel-body"><form id="task-form" class="stack"><div class="form-group"><label class="form-label">Título</label><input class="input" id="task-title" required></div><div class="form-group"><label class="form-label">Vencimiento</label><input class="input" id="task-due" type="datetime-local"></div><button class="btn btn--primary">CREAR TAREA</button></form></div></div><div class="panel"><div class="panel-header"><h2 class="panel-title">Nuevo recordatorio</h2></div><div class="panel-body"><form id="reminder-form" class="stack"><div class="form-group"><label class="form-label">Texto</label><input class="input" id="reminder-text" required></div><div class="form-group"><label class="form-label">Fecha y hora</label><input class="input" id="reminder-at" type="datetime-local" required></div><button class="btn btn--primary">PROGRAMAR</button></form></div></div></section>
<section class="section panel"><div class="panel-header"><h2 class="panel-title">Tareas</h2></div><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Título</th><th>Vencimiento</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="task-body"></tbody></table></div></div></section>
<section class="section panel"><div class="panel-header"><h2 class="panel-title">Recordatorios</h2></div><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Texto</th><th>Ejecución</th><th>Estado</th></tr></thead><tbody id="reminder-body"></tbody></table></div></div></section>
{% endblock %}
